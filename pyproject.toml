[project]
name = "bookmyseat"
version = "1.0.0"
description = "BookMySeat movie ticket booking backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "sqlalchemy==2.0.43",
  "psycopg[binary]==3.2.9",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "python-dotenv==1.1.1",
  "qrcode[pil]==8.2",
  "PyJWT[crypto]==2.10.1",
  "cryptography>=45.0.0",
]

[tool.vercel]
entrypoint = "backend.main:app"
